<!DOCTYPE html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="مشاهده و جستجوی همه محصولات فروشگاه کامفی" />
    <title>Products | Comfy</title>
    <!-- font-awesome -->
    <link
      rel="stylesheet"
      href="vendor/fontawesome/css/all.min.css"
    />


    <link rel="icon" type="image/svg+xml" href="images/logo.svg">

    
    <!-- styles css -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- navbar -->
    <nav class="navbar page">
      <div class="nav-center">
        <!-- cart icon -->
        <div class="toggle-container">
          <button class="toggle-cart">
            <i class="fas fa-shopping-cart"></i>
          </button>
          <span class="cart-item-count">1</span>
        </div>
        <!-- logo -->
        <!-- <img src=".images/logo.svg" class="nav-logo" alt="logo" /> -->
        <!-- links -->
        <div>
          <button class="toggle-nav">
            <i class="fas fa-bars"></i>
          </button>
          <ul class="nav-links">
            <li>
              <a href="about.html" class="nav-link">
                درباره ما
              </a>
            </li>
            <li>
              <a href="products.html" class="nav-link">
                محصولات
              </a>
            </li>
            <li>
              <a href="index.html" class="nav-link">
                خانه
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- hero -->
    <section class="page-hero">
      <div class="section-center">
        <h3 class="page-hero-title">خانه / محصولات</h3>
      </div>
    </section>
    <!-- sidebar -->
    <div class="sidebar-overlay">
      <aside class="sidebar">
        <!-- close -->
        <button class="sidebar-close">
          <i class="fas fa-times"></i>
        </button>
        <!-- links -->
        <ul class="sidebar-links">
          <li>
            <a href="index.html" class="sidebar-link">
              <i class="fas fa-home fa-fw"></i>
              خانه
            </a>
          </li>
          <li>
            <a href="products.html" class="sidebar-link">
              <i class="fas fa-shopping-bag fa-fw"></i>
              محصولات
            </a>
          </li>
          <li>
            <a href="about.html" class="sidebar-link">
              <i class="fas fa-book fa-fw"></i>
              درباره ما
            </a>
          </li>
        </ul>
      </aside>
    </div>
    <!-- cart -->
    <div class="cart-overlay">
      <aside class="cart">
        <button class="cart-close" aria-label="بستن سبد خرید">
          <i class="fas fa-times"></i>
        </button>
        <header>
          <h3 class="text-slanted">سبد خرید</h3>
        </header>
        <!-- cart items -->
        <div class="cart-items"></div>
        <!-- footer -->
        <footer>
          <h3 class="cart-total text-slanted">
            total : $12.99
          </h3>
          <button class="cart-checkout btn">خریداری</button>
        </footer>
      </aside>
    </div>
    <!-- products -->
    <section class="products">
      <!-- products -->
      <div class="products-container"></div>
        <!-- filters -->
        <div class="filters">
          <div class="filters-container">
            <!-- search -->
            <form class="input-form">
              <input type="text" class="search-input" placeholder="جستجو ..." />
            </form>
            <!-- categories -->
            <h4>نوع محصول</h4>
            <article class="companies">
              <button class="company-btn">all</button>
              <button class="company-btn">ikea</button>
            </article>
            <!-- price -->
            <h4>قیمت</h4>
            <form class="price-form">
              <input
                type="range"
                class="price-filter"
              />
            </form>
            <p class="price-value"></p>
          </div>
        </div>
    </section>
    <!-- page loading -->
    <div class="page-loading">
      <h2>بارگذاری ...</h2>
    </div>
    <script type="module" src="./src/pages/products.js"></script>
  </body>
</html>
